<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5061ab">
  <title>Offline - School On App Connect</title>
  <style>
    :root { --brand: #5061ab; --brand-dark: #3d4c8c; --ink: #212121; --muted: #6b7280; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
      font-family: "Signika", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f5f6fa; color: var(--ink);
      -webkit-tap-highlight-color: transparent;
    }
    .card {
      width: 100%; max-width: 360px; background: #fff; border-radius: 18px;
      padding: 32px 24px; text-align: center;
      box-shadow: 0 12px 40px rgba(33, 33, 33, .12);
    }
    .badge {
      width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 20px;
      display: flex; align-items: center; justify-content: center;
      background: var(--brand); color: #fff; font-size: 26px; font-weight: 700;
      letter-spacing: .5px;
    }
    h1 { font-size: 20px; margin: 0 0 8px; font-weight: 600; }
    p { font-size: 14px; line-height: 1.55; color: var(--muted); margin: 0 0 24px; }
    button {
      width: 100%; border: 0; border-radius: 12px; padding: 14px 18px;
      background: var(--brand); color: #fff; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background .15s ease;
    }
    button:active { background: var(--brand-dark); }
    .hint { margin-top: 16px; font-size: 12px; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">SOA</div>
    <h1>You're offline</h1>
    <p>School On App Connect can't reach the school server right now. Check your internet connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <div class="hint">If this keeps happening, your school's server may be under maintenance.</div>
  </div>
</body>
</html>
